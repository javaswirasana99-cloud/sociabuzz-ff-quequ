<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antrian BY1 FF</title><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif}.panel{width:260px;background:#080808;border:1px solid #333;border-radius:10px;overflow:hidden;box-shadow:0 3px 14px #0008}.head{padding:7px 10px;color:#ff8a35;font-size:10px;font-weight:900;letter-spacing:1.5px}.list{padding:0 8px 8px;display:grid;gap:5px}.player{display:flex;align-items:center;gap:7px;border:1px solid #761d1d;background:#100707;border-radius:7px;padding:5px}.num{width:23px;height:23px;border-radius:6px;background:#ff3025;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}.details{min-width:0;flex:1}.nick{font-size:9px;font-weight:900;overflow-wrap:anywhere}.pid{font-size:8px;color:#aaa}.live{background:#ed1e24;border-radius:5px;padding:4px 6px;font-size:8px;font-weight:900}.empty{font-size:9px;color:#aaa;padding:6px 4px}.foot{font-size:8px;color:#777;text-align:right;padding:0 9px 6px}
</style></head><body><div class="panel"><div class="head">⚡ ANTRIAN BY1</div><div id="list" class="list"><div class="empty">Menunggu antrean...</div></div><div class="foot">AUTO UPDATE</div></div><script>
async function update(){try{const r=await fetch('/api/queue',{cache:'no-store'});if(!r.ok)return;const d=await r.json();const list=document.getElementById('list');if(!d.queue.length){list.innerHTML='<div class="empty">Belum ada antrean</div>';return}list.innerHTML=d.queue.map((p,i)=>`<div class="player"><div class="num">${i+1}</div><div class="details"><div class="nick">${esc(p.nickname)}</div><div class="pid">${esc(p.playerId)}</div></div><div class="live">LIVE</div></div>`).join('')}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}update();setInterval(update,2000);
</script></body></html>
